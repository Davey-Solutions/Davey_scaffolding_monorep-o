name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint, test, and build
        working-directory: frontend
        run: npm run lint && npm run test && npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and verify
        run: ./mvnw --batch-mode verify

      - name: Build Docker images with Jib
        run: ./mvnw --batch-mode -pl services/auth-service,services/job-service,gateway jib:dockerBuild

  integration-per-service:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: auth-service
            modules: services/auth-service
            test_path: it-tests/auth-service/
            it_base_url: http://localhost:8082
            it_gateway_base_url: http://localhost:8082
            it_auth_service_base_url: http://localhost:8082
            it_job_service_base_url: http://localhost:18082
          - suite: job-service
            modules: services/job-service
            test_path: it-tests/job-service/
            it_base_url: http://localhost:18082
            it_gateway_base_url: http://localhost:18082
            it_auth_service_base_url: http://localhost:8082
            it_job_service_base_url: http://localhost:18082
          - suite: gateway
            modules: "services/auth-service services/job-service gateway"
            test_path: it-tests/gateway/
            it_base_url: http://localhost:8080
            it_gateway_base_url: http://localhost:8080
            it_auth_service_base_url: http://localhost:8082
            it_job_service_base_url: http://localhost:18082

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install IT dependencies
        run: python -m pip install -r it-tests/requirements.txt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build images with Jib
        run: |
          for module in ${{ matrix.modules }}; do
            image="ghcr.io/davey-solutions/$(basename "${module}")"
            ./mvnw --batch-mode --no-transfer-progress \
              -pl "${module}" \
              package jib:dockerBuild -DskipTests \
              -Djib.to.image="${image}" \
              -Djib.to.tags=latest
          done

      - name: Create .env for docker compose
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          echo "JWT_SECRET=${JWT_SECRET}" > .env

      - name: Pull postgres image
        run: docker pull postgres:16

      - name: Start stack
        run: docker compose up -d --pull never --wait --timeout 120

      - name: Run per-service IT suite
        env:
          IT_BASE_URL: ${{ matrix.it_base_url }}
          IT_GATEWAY_BASE_URL: ${{ matrix.it_gateway_base_url }}
          IT_AUTH_SERVICE_BASE_URL: ${{ matrix.it_auth_service_base_url }}
          IT_JOB_SERVICE_BASE_URL: ${{ matrix.it_job_service_base_url }}
          IT_AUTH_OWNER_EMAIL: owner@example.com
          IT_AUTH_OWNER_PASSWORD: owner-password
        run: python -m pytest ${{ matrix.test_path }}

      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs-${{ matrix.suite }}.txt || true

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: compose-logs-${{ matrix.suite }}.txt

      - name: Tear down
        if: always()
        run: docker compose down -v

  integration-system:
    runs-on: ubuntu-latest
    needs: integration-per-service
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install IT dependencies
        run: python -m pip install -r it-tests/requirements.txt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build images with Jib
        run: |
          for module in services/auth-service services/job-service gateway; do
            image="ghcr.io/davey-solutions/$(basename "${module}")"
            ./mvnw --batch-mode --no-transfer-progress \
              -pl "${module}" \
              package jib:dockerBuild -DskipTests \
              -Djib.to.image="${image}" \
              -Djib.to.tags=latest
          done

      - name: Create .env for docker compose
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          echo "JWT_SECRET=${JWT_SECRET}" > .env

      - name: Pull postgres image
        run: docker pull postgres:16

      - name: Start full stack
        run: docker compose up -d --pull never --wait --timeout 120

      - name: Run whole-system IT suite
        env:
          IT_BASE_URL: http://localhost:8080
          IT_GATEWAY_BASE_URL: http://localhost:8080
          IT_AUTH_SERVICE_BASE_URL: http://localhost:8082
          IT_JOB_SERVICE_BASE_URL: http://localhost:18082
          IT_AUTH_OWNER_EMAIL: owner@example.com
          IT_AUTH_OWNER_PASSWORD: owner-password
        run: python -m pytest it-tests/system/

      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs-system.txt || true

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-system-${{ github.run_id }}-${{ github.run_attempt }}
          path: compose-logs-system.txt

      - name: Save tested images
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p tested-images
          for image in auth-service job-service gateway; do
            docker save "ghcr.io/davey-solutions/${image}:latest" -o "tested-images/${image}.tar"
          done

      - name: Upload tested images
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tested-images-${{ github.run_id }}
          path: tested-images/

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish-images:
    runs-on: ubuntu-latest
    needs: integration-system
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download tested images
        uses: actions/download-artifact@v4.1.3
        with:
          name: tested-images-${{ github.run_id }}
          path: tested-images

      - name: Load tested images into Docker
        run: |
          for image_tar in tested-images/*.tar; do
            docker load -i "${image_tar}"
          done

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Resolve project version
        run: |
          raw_version=$(./mvnw --batch-mode -q -Dstyle.color=never -DforceStdout help:evaluate -Dexpression=project.version | tr -d '\r' | awk 'NF && $0 !~ /^\\[/ {line=$0} END {gsub(/^[[:space:]]+|[[:space:]]+$/, "", line); print line}')
          project_version=$(echo "${raw_version}" | sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          if ! echo "${project_version}" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "Resolved project version is not a valid Docker tag after sanitization: ${project_version}" >&2
            exit 1
          fi
          short_sha=$(echo "${GITHUB_SHA}" | cut -c1-12)
          echo "PROJECT_VERSION=${project_version}" >> "${GITHUB_ENV}"
          echo "COMMIT_SHA_TAG=${short_sha}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested images to GHCR
        run: |
          for image in auth-service job-service gateway; do
            docker tag "ghcr.io/davey-solutions/${image}:latest" "ghcr.io/davey-solutions/${image}:${PROJECT_VERSION}"
            docker tag "ghcr.io/davey-solutions/${image}:latest" "ghcr.io/davey-solutions/${image}:${COMMIT_SHA_TAG}"
            docker push "ghcr.io/davey-solutions/${image}:latest"
            docker push "ghcr.io/davey-solutions/${image}:${PROJECT_VERSION}"
            docker push "ghcr.io/davey-solutions/${image}:${COMMIT_SHA_TAG}"
          done
