name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and verify
        run: ./mvnw --batch-mode verify

      - name: Build Docker images with Jib
        run: ./mvnw --batch-mode -pl services/auth-service,services/job-service,gateway jib:dockerBuild

  integration:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images with Jib
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          -pl services/auth-service,services/job-service,gateway
          jib:build

      - name: Create .env for docker compose
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          echo "JWT_SECRET=${JWT_SECRET}" > .env

      - name: Start stack
        run: docker compose up -d --wait --timeout 120

      - name: Smoke test — gateway health
        run: curl --fail --retry 5 --retry-delay 3 http://localhost:8080/actuator/health

      - name: Tear down
        if: always()
        run: docker compose down -v
