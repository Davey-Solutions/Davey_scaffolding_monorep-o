name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint, test, and build
        working-directory: frontend
        run: npm run lint && npm run test && npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and verify
        run: ./mvnw --batch-mode verify

      - name: Build Docker images with Jib
        run: ./mvnw --batch-mode -pl services/auth-service,services/job-service,gateway jib:dockerBuild

  integration:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build images with Jib
        run: |
          for module in services/auth-service services/job-service gateway; do
            image="ghcr.io/davey-solutions/$(basename "${module}")"
            ./mvnw --batch-mode --no-transfer-progress \
              -pl "${module}" \
              package jib:dockerBuild -DskipTests \
              -Djib.to.image="${image}" \
              -Djib.to.tags=latest
          done

      - name: Create .env for docker compose
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          echo "JWT_SECRET=${JWT_SECRET}" > .env

      - name: Start stack
        run: docker compose up -d --pull never --wait --timeout 120

      - name: Smoke test — gateway health
        run: curl --fail --retry 5 --retry-delay 3 http://localhost:8080/actuator/health

      - name: Resolve project version
        if: github.ref == 'refs/heads/main'
        run: echo "PROJECT_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested images to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          for image in auth-service job-service gateway; do
            docker tag "ghcr.io/davey-solutions/${image}:latest" "ghcr.io/davey-solutions/${image}:${PROJECT_VERSION}"
            docker tag "ghcr.io/davey-solutions/${image}:latest" "ghcr.io/davey-solutions/${image}:${GITHUB_SHA}"
            docker push "ghcr.io/davey-solutions/${image}:latest"
            docker push "ghcr.io/davey-solutions/${image}:${PROJECT_VERSION}"
            docker push "ghcr.io/davey-solutions/${image}:${GITHUB_SHA}"
          done

      - name: Tear down
        if: always()
        run: docker compose down -v
