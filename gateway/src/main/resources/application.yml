spring:
  application:
    name: gateway
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@clientAddressKeyResolver}"
            rate-limiter: "#{@inMemoryRateLimiter}"
      routes:
        - id: job-service
          uri: ${JOB_SERVICE_URI:http://job-service:8080}
          predicates:
            - Path=/api/v1/jobs/**

        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://auth-service:8080}
          predicates:
            - Path=/api/v1/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

# JWT signing key shared with auth-service.  Must be a plain UTF-8 string of
# at least 32 characters (256-bit HMAC-SHA256 key).
# Sourced from the JWT_SECRET environment variable; startup will fail if unset.
jwt:
  secret: ${JWT_SECRET}
