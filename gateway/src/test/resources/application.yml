spring:
  application:
    name: gateway-test
  cloud:
    gateway:
      routes:
        - id: job-service
          uri: ${JOB_SERVICE_URI:http://job-service:8080}
          predicates:
            - Path=/api/v1/jobs/**

        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://auth-service:8080}
          predicates:
            - Path=/api/v1/auth/**

jwt:
  secret: test-secret-key-that-is-at-least-32-chars!
