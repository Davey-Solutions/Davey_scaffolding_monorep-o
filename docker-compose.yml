services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD:-jobs_pass}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
    volumes:
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    image: ghcr.io/davey-solutions/auth-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      JAVA_TOOL_OPTIONS: "-Xmx128m"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  job-service:
    image: ghcr.io/davey-solutions/job-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD:-jobs_pass}
      JAVA_TOOL_OPTIONS: "-Xmx128m"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    image: ghcr.io/davey-solutions/gateway:latest
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-Xmx128m"
    depends_on:
      auth-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
