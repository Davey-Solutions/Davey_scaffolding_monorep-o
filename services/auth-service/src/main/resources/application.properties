spring.application.name=auth-service
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# JWT signing key sourced from the environment variable JWT_SECRET.
# The value must be a plain UTF-8 string of at least 32 characters (256-bit HMAC-SHA256 key).
# Startup will fail fast if JWT_SECRET is not set.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=604800000
