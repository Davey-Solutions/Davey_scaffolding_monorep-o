spring.application.name=job-service
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
# JWT validation: shared HMAC-SHA256 signing secret sourced from the JWT_SECRET environment variable.
# Must match the secret used by auth-service to sign tokens.
# The value must be a plain UTF-8 string of at least 32 characters.
# Startup will fail fast if JWT_SECRET is not set.
jwt.secret=${JWT_SECRET}
